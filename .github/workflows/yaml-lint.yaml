name: YAML Lint

# Runs on every push and pull request that touches YAML files,
# so misconfigured manifests are caught before they reach FluxCD.
on:
  push:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.yml"
      - "**/*.yaml"
  workflow_dispatch: {}

jobs:
  yamllint:
    name: Lint YAML manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install yamllint
        run: pip install yamllint

      - name: Run yamllint
        run: yamllint -c .yamllint.yml .
