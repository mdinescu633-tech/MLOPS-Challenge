# yamllint config for Kubernetes / FluxCD manifests.

extends: default

rules:

  document-start: disable

  line-length:
    max: 160
    level: warning

  indentation:
    spaces: 2
    indent-sequences: consistent

  truthy:
    allowed-values: ["true", "false", "on", "off"]
    check-keys: false

  comments:
    min-spaces-from-content: 1

  empty-values: disable

ignore: |
  .git/
  clusters/mlops/flux-system/gotk-components.yaml
  clusters/mlops/flux-system/gotk-sync.yaml
  infrastructure/keycloak/sealed-secret.yaml
  infrastructure/keycloak/keycloak-realm-import-sealed.yaml
